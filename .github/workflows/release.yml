name: Release

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up pnpm and Node.js 24 LTS
              uses: pnpm/setup@v2
              with:
                  runtime: node@24
                  cache: true

            # npm 11.5+ is required for OIDC trusted publishing.
            - name: Update npm
              run: npm install --global npm@latest

            - name: Validate package
              run: pnpm run ci

            - name: Publish to npm
              run: npm publish --access public --no-git-checks --provenance

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
